# Cosmo Router config — 3 throttling features
# (Depth limit, Query complexity, and the custom Response-size module)
#
# Runs standalone against a locally-composed execution config (config.json),
# the same pattern as examples/router-simple. Listens on localhost:3003.

version: "1"
dev_mode: true
listen_addr: localhost:3003

execution_config:
  file:
    path: config.json      # the composed supergraph (generate with: wgc router compose)
    watch: true

# ---------------------------------------------------------------------------
# Feature 2 — Depth limit  (Cosmo native)
# Feature 3 — Query complexity  (Cosmo native)
# ---------------------------------------------------------------------------
security:
  complexity_limits:
    mode: enforce
    depth:
      enabled: true
      limit: 6            # reject queries nested deeper than 6 levels
    total_fields:
      enabled: true
      limit: 60
    root_fields:
      enabled: true
      limit: 5

  cost_control:
    enabled: true
    mode: enforce
    max_estimated_limit: 200   # reject queries whose estimated cost exceeds 200

# ---------------------------------------------------------------------------
# Feature 1 — Response-size limit  (CUSTOM Go module: responseSizeLimit)
# Read by custom-module/modules/response_size.go (keyed by module ID).
# Requires the custom router build that includes that module.
# ---------------------------------------------------------------------------
modules:
  responseSizeLimit:
    max_response_bytes: 400    # reject responses whose body exceeds 400 bytes
